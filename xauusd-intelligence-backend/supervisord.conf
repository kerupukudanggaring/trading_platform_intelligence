[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ===== Proses 1: FastAPI (API untuk frontend) =====
[program:api]
command=sh -c "uvicorn main:app --host 0.0.0.0 --port %(ENV_PORT)s"
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ===== Proses 2: Scheduler (ingest/scraping/scoring berkala) =====
[program:scheduler]
command=python scheduler_runner.py
directory=/app
autostart=true
autorestart=true
startretries=5
; Kalau scheduler crash berkali-kali (misal API pihak ketiga down),
; tetap coba restart tapi jangan spam terlalu cepat.
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
